# Build one source archive, then build and test Linux and Windows wheels from it.
# CI, Release, and Public release wheels call it for distribution checks.

name: Build distributions

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      retention-days:
        default: 14
        type: number
    outputs:
      version:
        description: Version of the tested distributions
        value: ${{ jobs.collect.outputs.version }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  source:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.source.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and check the source distribution
        id: source
        run: |
          python -m pip install build twine trove-classifiers packaging
          python -m build --sdist --outdir source-dist
          python -m twine check --strict source-dist/*
          python tools/check_distributions.py source-dist/*
          sha256sum source-dist/*.tar.gz
          echo "sha256=$(sha256sum source-dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-source
          path: source-dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  platform:
    name: Build and test ${{ matrix.platform }} wheel
    needs: source
    env:
      SDIST_SHA256: ${{ needs.source.outputs.sha256 }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build and validation tools
        run: python -m pip install build twine trove-classifiers packaging

      - name: Self-test the distribution checker
        run: python tools/check_distributions.py --self-test

      - name: Download the source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}-source
          path: source-dist

      - name: Build Linux wheel from sdist and repair it
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/io" --workdir /io \
            quay.io/pypa/manylinux_2_28_x86_64@sha256:c2261579b9c2e5d45aa93312f73e2a302182e3e977b558581a1838d6fed3d8e6 \
            bash .github/scripts/build-linux-wheel.sh source-dist/*.tar.gz "$SDIST_SHA256"

      - name: Set up Rust for Windows
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Build Windows wheel from sdist
        if: runner.os == 'Windows'
        run: python .github/scripts/build-wheel.py source-dist/*.tar.gz --sha256 "$SDIST_SHA256" --outdir dist

      - name: Check distribution metadata and release requirements
        run: |
          python -m twine check --strict dist/*
          python tools/check_distributions.py dist/*

      - name: Exercise the installed Linux wheel
        if: runner.os == 'Linux'
        run: python tools/test_installed_wheel.py dist/*.whl --version "$(tr -d '[:space:]' < VERSION.md)"

      - name: Exercise the installed Windows wheel
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (
            echo No Visual Studio install with the MSVC x64 tools
            exit /b 1
          )
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set /p VERSION=<VERSION.md
          for %%w in (dist\*.whl) do python tools/test_installed_wheel.py "%%w" --version "%VERSION%" || exit /b 1

      - name: Upload tested platform distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  collect:
    name: Collect tested distributions
    needs: [source, platform]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.collect.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-name }}-*
          path: platform-dist

      - name: Collect both platforms and one source distribution
        id: collect
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          SDIST_SHA256: ${{ needs.source.outputs.sha256 }}
        run: |
          python -m pip install packaging
          python .github/scripts/collect-distributions.py

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
