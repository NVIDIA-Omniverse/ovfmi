<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="774" viewBox="0 0 1080 774" role="img" aria-labelledby="title description">
  <title id="title">ovfmi runtime layers and SSP preparation</title>
  <desc id="description">At runtime, the sample application calls the public FmiHost API, which manages routing and lifecycle. It selects either NativeBackend, a Python ctypes bridge through a private C ABI to the Rust fmi-rs runtime, or FmpyBackend, which uses the Python FMI and SSP master. Separately, before runtime, SSP source is converted by build_ssp_container.py and FMPy into a native container FMU.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#586675"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #192735; }
      .title { font-size: 27px; font-weight: 700; }
      .section { font-size: 17px; font-weight: 700; letter-spacing: 1.5px; }
      .label { font-size: 21px; font-weight: 700; }
      .detail { font-size: 17px; fill: #495a6c; }
      .code { font-family: Consolas, 'Liberation Mono', monospace; font-size: 21px; font-weight: 700; }
      .arrow { fill: none; stroke: #586675; stroke-width: 2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #586675; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1080" height="774" rx="18" fill="#ffffff"/>
  <text class="title" x="48" y="46">One public API, two FMI runtimes</text>
  <text class="section" x="48" y="87">RUNTIME</text>

  <rect x="48" y="108" width="252" height="84" rx="12" fill="#f1f4f7" stroke="#c8d2dc"/>
  <text class="label" x="174" y="144" text-anchor="middle">Sample application</text>
  <text class="detail" x="174" y="171" text-anchor="middle">Rendering and physics</text>

  <path class="arrow" d="M 300 150 H 341"/>
  <rect x="344" y="108" width="294" height="84" rx="12" fill="#eaf4da" stroke="#76a634" stroke-width="2"/>
  <text class="code" x="491" y="144" text-anchor="middle">FmiHost</text>
  <text class="detail" x="491" y="171" text-anchor="middle">Public Python API</text>

  <path class="arrow" d="M 638 150 H 679"/>
  <rect x="682" y="108" width="350" height="84" rx="12" fill="#f1f4f7" stroke="#c8d2dc"/>
  <text class="label" x="857" y="144" text-anchor="middle">Routing and lifecycle</text>
  <text class="detail" x="857" y="171" text-anchor="middle">USD identities and FMI instances</text>

  <path class="branch" d="M 857 192 V 222 H 276"/>
  <path class="arrow" d="M 276 222 V 263"/>
  <path class="arrow" d="M 804 222 V 263"/>
  <text class="detail" x="540" y="246" text-anchor="middle">Select one backend</text>

  <rect x="48" y="266" width="456" height="270" rx="14" fill="#eef4fb" stroke="#c3d4e9"/>
  <text class="code" x="276" y="305" text-anchor="middle">FmpyBackend</text>
  <text class="detail" x="276" y="331" text-anchor="middle">Python backend</text>
  <path class="arrow" d="M 276 347 V 402"/>
  <rect x="80" y="405" width="392" height="92" rx="10" fill="#ffffff" stroke="#adc2dd"/>
  <text class="label" x="276" y="445" text-anchor="middle">Python FMI / SSP master</text>
  <text class="detail" x="276" y="475" text-anchor="middle">FMPy at runtime</text>

  <rect x="576" y="266" width="456" height="270" rx="14" fill="#f0f6e8" stroke="#bdcea5"/>
  <text class="code" x="804" y="305" text-anchor="middle">NativeBackend</text>
  <text class="detail" x="804" y="331" text-anchor="middle">Python ctypes bridge · default</text>
  <path class="arrow" d="M 804 347 V 364"/>
  <rect x="608" y="367" width="392" height="54" rx="10" fill="#ffffff" stroke="#b0c694"/>
  <text class="label" x="804" y="401" text-anchor="middle">Private C ABI</text>
  <path class="arrow" d="M 804 421 V 444"/>
  <rect x="608" y="447" width="392" height="62" rx="10" fill="#ffffff" stroke="#b0c694"/>
  <text class="label" x="804" y="473" text-anchor="middle">fmi-rs</text>
  <text class="detail" x="804" y="496" text-anchor="middle">Rust FMI execution</text>

  <rect x="48" y="568" width="984" height="174" rx="14" fill="#f7f8fa" stroke="#d3dbe3"/>
  <text class="section" x="72" y="601">SSP PREPARATION · BUILD TIME ONLY</text>
  <rect x="72" y="624" width="184" height="64" rx="10" fill="#ffffff" stroke="#c8d2dc"/>
  <text class="label" x="164" y="663" text-anchor="middle">SSP source</text>
  <path class="arrow" d="M 256 656 H 295"/>
  <rect x="298" y="624" width="436" height="64" rx="10" fill="#ffffff" stroke="#c8d2dc"/>
  <text x="516" y="663" text-anchor="middle" font-family="Consolas, monospace" font-size="20">build_ssp_container.py + FMPy</text>
  <path class="arrow" d="M 734 656 H 773"/>
  <rect x="776" y="624" width="232" height="64" rx="10" fill="#eaf4da" stroke="#b0c694"/>
  <text class="label" x="892" y="651" text-anchor="middle">Native container</text>
  <text class="label" x="892" y="677" text-anchor="middle">FMU</text>
  <text class="detail" x="72" y="720">Prepared before application startup; loaded by the native backend.</text>
</svg>
